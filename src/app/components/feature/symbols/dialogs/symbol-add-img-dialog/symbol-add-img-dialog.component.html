<h2 mat-dialog-title>Ajouter une image</h2>

<mat-dialog-content>
  <app-file-upload
    allowedFileType="image/png,image/jpg,image/jpeg,image/tiff"
    [uploadState]="uploadState()"
    (fileUpload)="onFileUpload($event)"
    (onCancel)="onCancel()"
    (onBack)="onCancel()" />
</mat-dialog-content>
