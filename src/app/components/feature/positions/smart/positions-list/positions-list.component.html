<div class="positions-list">
  <div class="header">
    <div class="title-section">
      <h1>Positions ({{ filteredPositions().length }})</h1>
    </div>
    <button mat-raised-button color="primary" (click)="onAdd()">
      <mat-icon>add</mat-icon>
      Ajouter
    </button>
  </div>

  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Rechercher</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Rechercher une position...">
    <mat-icon matPrefix>search</mat-icon>
  </mat-form-field>

  <div class="list-container">
    @for (position of filteredPositions(); track position.id) {
      <mat-card class="item-card">
        <mat-card-content>
          <div class="item-content">
            <span class="item-name">{{ position.name }}</span>
            <div class="item-actions">
              <button mat-icon-button (click)="onEdit(position.id, position.name)" matTooltip="Modifier">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="onDelete(position.id, position.name)" matTooltip="Supprimer">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    } @empty {
      <p class="no-results">Aucune position trouvée</p>
    }
  </div>
</div>
