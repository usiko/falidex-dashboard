<mat-toolbar color="primary" class="top-bar">
  <div class="left-section">
    <mat-form-field appearance="outline" class="relation-select">
      <mat-label>Relation</mat-label>
      <mat-select 
        [value]="selectedRelationId()" 
        (selectionChange)="onRelationChange($event.value)">
        <mat-select-trigger>
          @if (selectedRelation()) {
            <span class="relation-option">
              <span>{{ selectedRelation()!.name}} - {{selectedRelation()!.annee}}</span>
              @if (!selectedRelation()!.editable) {
                <mat-icon class="lock-icon">lock</mat-icon>
              }
            </span>
          }
        </mat-select-trigger>
        @for (relation of relations(); track relation.id) {
          <mat-option [value]="relation.id">
            <span class="relation-option">
              <span>{{ relation.name}} - {{relation.annee}}</span>
              @if (!relation.editable) {
                <mat-icon class="lock-icon">lock</mat-icon>
              }
            </span>
          </mat-option>
        }
      </mat-select>
    </mat-form-field>
    <button mat-mini-fab color="accent" (click)="onAddRelation()" matTooltip="Ajouter une relation">
      <mat-icon>add</mat-icon>
    </button>
  </div>

  <span class="spacer"></span>

  <div class="right-section">
     <button mat-button routerLink="/relation/current/edit" routerLinkActive="active">
      <mat-icon>info</mat-icon>
      Relation Info
    </button>
    <button mat-button routerLink="/filieres" routerLinkActive="active">
      <mat-icon>school</mat-icon>
      Filières
    </button>
    <button mat-button routerLink="/symbols" routerLinkActive="active">
      <mat-icon>star</mat-icon>
      Symboles
    </button>

  </div>
</mat-toolbar>
