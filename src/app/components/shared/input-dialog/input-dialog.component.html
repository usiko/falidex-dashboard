<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  @if (data.message) {
    <p>{{ data.message }}</p>
  }
  
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>{{ placeholder }}</mat-label>
    <input matInput [(ngModel)]="inputValue" (keyup.enter)="onConfirm()" autofocus />
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ cancelText }}</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="!inputValue.trim()">
    {{ confirmText }}
  </button>
</mat-dialog-actions>
