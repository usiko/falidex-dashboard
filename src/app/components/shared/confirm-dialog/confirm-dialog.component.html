<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <p class="message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">{{ cancelText }}</button>
  <button mat-raised-button color="warn" (click)="onConfirm()" [disabled]="data.disabled">{{ confirmText }}</button>
</mat-dialog-actions>
