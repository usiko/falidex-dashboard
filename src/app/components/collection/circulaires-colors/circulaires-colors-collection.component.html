@if (loading()) {
  <div class="spinner-wrapper"><mat-spinner diameter="32" /></div>
} @else {
<div class="collection">
  @for (circulaireColor of circulairesColors(); track circulaireColor.id) {
    <div class="collection-item" 
         [class.selectable]="selectable()"
         (click)="onSelect(circulaireColor)">
      {{ circulaireColor.name }}
    </div>
  }
</div>
}
