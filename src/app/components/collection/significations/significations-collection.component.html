@if (loading()) {
  <div class="spinner-wrapper"><mat-spinner diameter="32" /></div>
} @else {
<div class="collection">
  @for (signification of significations(); track signification.id) {
    <div class="collection-item" 
         [class.selectable]="selectable()"
         (click)="onSelect(signification)">
      {{ signification.content }}
    </div>
  } @empty {
    @if (searchTerm().trim()) {
      <div class="empty-state">
        <p>Aucune signification trouvée</p>
        @if (selectable()) {
          <button mat-raised-button color="primary" (click)="onCreate()" [disabled]="!isLoggedIn()">
            <mat-icon>add</mat-icon>
            Ajouter la recherche
          </button>
        }
      </div>
    }
  }
</div>
}
